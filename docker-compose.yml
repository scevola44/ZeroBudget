services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zerobudget
      POSTGRES_PASSWORD: zerobudget
      POSTGRES_DB: zerobudget
    ports:
      - "5432:5432"
    volumes:
      - zerobudget_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerobudget"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://zerobudget:zerobudget@db:5432/zerobudget
      JWT_SECRET: dev-secret-change-me-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -e . &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  zerobudget_pgdata:
