name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (with dev extras)
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check + build
        run: npm run build

  deploy:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only on merges (push) to main or develop — PR runs stay test-only.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ghcr.io logins intermittently time out on GitHub-hosted runners; retry a few times.
          max_attempts=5
          retry_wait_seconds=10
          attempt=1
          until echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "GHCR login failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "GHCR login attempt $attempt failed, retrying in ${retry_wait_seconds}s..." >&2
            sleep "$retry_wait_seconds"
            attempt=$((attempt + 1))
          done

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/scevola44/zerobudget
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short

      - name: Build & push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          label_args=()
          while IFS= read -r label; do
            [ -n "$label" ] && label_args+=(--label "$label")
          done <<< "$LABELS"

          # Same class of transient ghcr.io timeout as the login step; retry the push.
          max_attempts=3
          retry_wait_seconds=15
          attempt=1
          until docker buildx build \
              --file ./Dockerfile \
              --push \
              "${tag_args[@]}" \
              "${label_args[@]}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              .; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Build & push failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "Build & push attempt $attempt failed, retrying in ${retry_wait_seconds}s..." >&2
            sleep "$retry_wait_seconds"
            attempt=$((attempt + 1))
          done
