name: Prepare Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          CURRENT=$(cat VERSION)
          echo "Current version: $CURRENT"

          # Strip beta suffix if present
          if [[ "$CURRENT" =~ ^(.+)-beta\.[0-9]+$ ]]; then
            STABLE="${BASH_REMATCH[1]}"
          else
            STABLE="$CURRENT"
          fi

          echo "stable=$STABLE" >> $GITHUB_OUTPUT
          echo "Stable version: $STABLE"

      - name: Check if already stable
        id: check
        env:
          STABLE: ${{ steps.version.outputs.stable }}
          CURRENT: ${{ github.event.pull_request.head.sha }}
        run: |
          CURRENT_VERSION=$(cat VERSION)
          if [[ "$CURRENT_VERSION" == "$STABLE" ]]; then
            echo "Version is already stable, skipping release prep"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Create stable version branch (main)
        if: steps.check.outputs.skip == 'false'
        env:
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          git checkout -b "chore/release-${STABLE}"

      - name: Update version files to stable
        if: steps.check.outputs.skip == 'false'
        env:
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          # Update VERSION file
          echo "$STABLE" > VERSION

          # Update frontend/package.json
          cd frontend
          npm version "$STABLE" --no-git-tag-version
          cd ..

          # Update backend/pyproject.toml
          sed -i.bak "s/^version = .*/version = \"$STABLE\"/" backend/pyproject.toml
          rm -f backend/pyproject.toml.bak

      - name: Commit stable version
        if: steps.check.outputs.skip == 'false'
        env:
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/package.json frontend/package-lock.json backend/pyproject.toml
          git commit -m "chore: release v$STABLE"

      - name: Push stable branch
        if: steps.check.outputs.skip == 'false'
        env:
          STABLE: ${{ steps.version.outputs.stable }}
        run: |
          git push origin "chore/release-${STABLE}"

      - name: Create stable release PR
        if: steps.check.outputs.skip == 'false'
        env:
          STABLE: ${{ steps.version.outputs.stable }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "chore/release-${STABLE}" \
            --title "chore: release v$STABLE" \
            --body "Release version $STABLE"

      - name: Create sync PR back to develop
        if: steps.check.outputs.skip == 'false'
        env:
          STABLE: ${{ steps.version.outputs.stable }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout develop
          git pull origin develop
          git checkout -b "chore/sync-${STABLE}-to-develop"

          # Update version files to stable on develop branch
          echo "$STABLE" > VERSION
          cd frontend
          npm version "$STABLE" --no-git-tag-version
          cd ..
          sed -i.bak "s/^version = .*/version = \"$STABLE\"/" backend/pyproject.toml
          rm -f backend/pyproject.toml.bak

          git add VERSION frontend/package.json frontend/package-lock.json backend/pyproject.toml
          git commit -m "chore: sync v$STABLE from main"

          git push origin "chore/sync-${STABLE}-to-develop"
          gh pr create \
            --base develop \
            --head "chore/sync-${STABLE}-to-develop" \
            --title "chore: sync v$STABLE to develop" \
            --body "Sync stable release version back to develop"
